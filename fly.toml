app = "ilm"
primary_region = "iad"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  PYTHON_VERSION = "3.12"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["web"]

[[services.http_checks]]
  interval = "10s"
  grace_period = "5s"
  method = "GET"
  path = "/"
  protocol = "http"
  timeout = "2s"
