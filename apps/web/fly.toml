# Ilm web app on Fly.io. Run from the repository root:
#   fly deploy -c apps/web/fly.toml
#
# NEXT_PUBLIC_* and NEXT_INTERNAL_API_URL are inlined into the bundle at build
# time, so they are build args, not runtime secrets. Set a real contact email
# before deploying — next.config.js refuses to ship without one.
app = "ilm-web"
primary_region = "iad"

[build]
  # Resolved relative to this fly.toml, not the repository root.
  dockerfile = "Dockerfile"

  [build.args]
    NEXT_INTERNAL_API_URL = "http://ilm-api.internal:4000"
    NEXT_PUBLIC_SITE_URL = "https://ilm-web.fly.dev"
    NEXT_PUBLIC_CONTACT_EMAIL = "jay@pabandi.com"
    NEXT_PUBLIC_SUPPORT_URL = "https://square.link/u/QE4inlEt"
    ILM_DEPLOY = "true"

[env]
  PORT = "3000"
  NEXT_INTERNAL_API_URL = "http://ilm-api.internal:4000"
  # These are inlined into the bundle at build time, but next.config.js also
  # reads them when `next start` loads it, so they must exist at runtime too.
  NEXT_PUBLIC_SITE_URL = "https://ilm-web.fly.dev"
  NEXT_PUBLIC_CONTACT_EMAIL = "jay@pabandi.com"
  NEXT_PUBLIC_SUPPORT_URL = "https://square.link/u/QE4inlEt"
  ILM_DEPLOY = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "45s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
