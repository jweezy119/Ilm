# Ilm runs Postgres for passages, themes, cross-references and alignments.
#
# Search (Orama), scoring (Jev) and embeddings (OpenRouter) are all in-process or
# HTTP — there is no Meilisearch, Qdrant or Redis dependency to start.
#
#   docker compose up -d
#   docker compose logs -f postgres
#
# Host port is 5433 so it does not collide with another Postgres already on 5432.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ilm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ilm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ilm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ilm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ilm_postgres_data:
